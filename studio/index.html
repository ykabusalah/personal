<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow, noai, noimageai" />
    <meta name="referrer" content="no-referrer" />
    <title>Doodle Studio</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23111' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z'/%3E%3Cpath d='m15 5 4 4'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500;600&family=Nanum+Pen+Script&display=swap" />
    <link rel="stylesheet" href="studio.css" />
  </head>
  <body>
    <!-- Shown until a working private link is confirmed. -->
    <section class="gate" data-gate>
      <div class="card">
        <h1>Doodle Studio</h1>
        <p data-gate-message>Opening the studio…</p>
      </div>
    </section>

    <div class="app" data-app hidden>
      <header class="top">
        <h1>Doodle Studio</h1>
        <p class="hello" data-hello></p>
      </header>

      <main class="layout">
        <div class="tools" role="toolbar" aria-label="Drawing tools">
          <button type="button" class="tool" data-tool="pen" aria-pressed="true" title="Pen (B)" aria-label="Pen">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z" /><path d="m15 5 4 4" /></svg>
          </button>
          <button type="button" class="tool" data-tool="eraser" aria-pressed="false" title="Eraser (E)" aria-label="Eraser">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21" /><path d="M22 21H7" /><path d="m5 11 9 9" /></svg>
          </button>
          <span class="rule" aria-hidden="true"></span>
          <button type="button" class="tool size" data-size="0" aria-pressed="false" title="Thin ([)" aria-label="Thin"><span style="--dot: 5px"></span></button>
          <button type="button" class="tool size" data-size="1" aria-pressed="true" title="Medium" aria-label="Medium"><span style="--dot: 9px"></span></button>
          <button type="button" class="tool size" data-size="2" aria-pressed="false" title="Thick (])" aria-label="Thick"><span style="--dot: 14px"></span></button>
          <span class="rule" aria-hidden="true"></span>
          <button type="button" class="tool" data-undo title="Undo (Ctrl+Z)" aria-label="Undo" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5" /><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5a5.5 5.5 0 0 1-5.5 5.5H11" /></svg>
          </button>
          <button type="button" class="tool" data-redo title="Redo (Ctrl+Shift+Z)" aria-label="Redo" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 14 5-5-5-5" /><path d="M20 9H9.5A5.5 5.5 0 0 0 4 14.5A5.5 5.5 0 0 0 9.5 20H13" /></svg>
          </button>
          <button type="button" class="tool" data-clear title="Clear the page" aria-label="Clear the page" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18" /><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6" /><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" /></svg>
          </button>
        </div>

        <div class="board-wrap">
          <div class="board" data-board>
            <canvas data-canvas aria-label="Drawing board"></canvas>
            <div class="cursor" data-cursor aria-hidden="true"></div>
          </div>
        </div>

        <aside class="side">
          <section class="panel">
            <label class="field">
              <span>Name this doodle</span>
              <input data-name type="text" maxlength="60" placeholder="e.g. sleepy cat" autocomplete="off" />
            </label>

            <figure class="actual">
              <div class="actual-box"><canvas data-actual></canvas></div>
              <figcaption data-actual-caption>How it looks small</figcaption>
            </figure>

            <div class="actions">
              <button type="button" class="primary" data-save>Save</button>
              <button type="button" data-watch disabled>
                <svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="6 3 20 12 6 21 6 3" /></svg>
                Watch it
              </button>
              <button type="button" data-new>New doodle</button>
            </div>
            <p class="status" data-status role="status" aria-live="polite"></p>
          </section>

          <section class="panel" data-place hidden>
            <label class="field">
              <span>Spot</span>
              <select data-spot></select>
            </label>
            <p class="idea" data-idea hidden></p>
            <p class="owner-note" data-place-note></p>
          </section>

          <section class="panel">
            <h2 data-list-title>Your doodles</h2>
            <ul class="saved" data-saved></ul>
            <p class="empty" data-empty>Nothing saved yet.</p>
          </section>
        </aside>
      </main>
    </div>

    <script type="module" src="studio.js"></script>
  </body>
</html>
